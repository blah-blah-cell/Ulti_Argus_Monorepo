[project]
name = "argus-community"
version = "2.1.0"
description = "Local-first network observability and pluggable NIDS framework"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Argus Community contributors" }]
dependencies = [
  "PyYAML>=6.0",
  "fastapi>=0.115.0,<0.116.0",
  "numpy>=1.26.0",
  "psutil>=6.0.0",
  "scapy>=2.5.0",
  "slowapi>=0.1.9",
  "uvicorn>=0.32.0",
]

[project.optional-dependencies]
capture = [
  "pcapy-ng>=1.0.5",
]
dev = [
  "httpx>=0.27.0,<0.28.0",
  "ruff>=0.4.0",
  "pytest>=8.0",
  "pytest-asyncio>=0.21.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402"]
# server.py manipulates the package path before importing local modules.
"web/api/server.py" = ["E402", "F401", "I001"]

[tool.black]
line-length = 100
target-version = ["py311"]
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["argus_v"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
skip = [".venv"]
